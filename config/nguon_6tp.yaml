# Sổ nguồn cho 6 thành phố trực thuộc trung ương — CHỈ LÀ DANH SÁCH NGUỒN, chưa cào.
# Xác minh ngày 2026-10-13 bằng HTTP GET từ máy này (cột xac_minh).
#   200      = sống, đúng nội dung
#   000      = không kết nối được từ máy này (timeout/chặn) — CHƯA kết luận chết, thử lại qua trình duyệt
#   403      = chặn bot (Cloudflare) — không cào, dùng nguồn thay thế
#   search   = mới thấy trong kết quả tìm kiếm, chưa tải trang
# muc: A chính thống · B báo chí/tổng hợp chính thống · C tham khảo
# cach_lay: html | js | pdf | xlsx | api | json_nhung (JSON nhúng trong HTML)
#
# Cổng riêng từng xã/phường (đã dò tất cả 645 đơn vị): du_lieu/cong_xa_6tp.json
#   Hà Nội 126/126 · Hải Phòng 113/114 · Đà Nẵng 93/94 · Cần Thơ 103/103 · Huế 40/40 · TP.HCM 13/168
#   Mẫu: <slug>.<tp>.gov.vn (slug = tên bỏ tiền tố, bỏ dấu, viết liền: donganh, hoiantay, aluoi3).
#   TP.HCM KHÔNG theo mẫu chung: phần lớn là phuong<slug>.gov.vn / xa<slug>.gov.vn, ~90% chưa có cổng
#   → lấy trụ sở/điện thoại từ HCM-04/05, nội dung từ báo + Wikipedia + hcmcpv.org.vn.
#   Lưu ý: 13 tên trùng giữa các TP (Xã An Khánh, Phường Hương Trà…) → luôn khoá theo MÃ, không theo tên.

phien_ban: 2026-10-13

