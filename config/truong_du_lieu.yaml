          - {khoa: vung, nhan: Vùng kinh tế – xã hội, kieu: danh_sach, cach_lay: danh_muc, kiem_tra: [khong_rong]}
          - {khoa: tram_so_dien_thoai, nhan: Mã vùng điện thoại, kieu: dien_thoai, cach_lay: danh_muc, kiem_tra: [dien_thoai]}
          - {khoa: bien_so_xe, nhan: Biển số xe, kieu: van_ban, cach_lay: danh_muc}
          - {khoa: dien_tich_km2, nhan: Diện tích (km²), kieu: so, cach_lay: danh_muc, kiem_tra: [so_duong]}
          - {khoa: dan_so, nhan: Dân số (người), kieu: so, cach_lay: danh_muc, kiem_tra: [so_duong]}
          - {khoa: mat_do_dan_so, nhan: Mật độ dân số (người/km²), kieu: so, cach_lay: danh_muc, kiem_tra: [so_duong]}
