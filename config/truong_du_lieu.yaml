# Cấu hình trường dữ liệu — bản dịch từ màn "Thiết lập trường dữ liệu".
#
# Mỗi cấp (tinh / xa / thon) gồm nhiều nhóm; mỗi nhóm gồm nhiều trường.
# Thuộc tính một trường:
#   khoa       mã trường (khoá JSON, không dấu)
#   nhan       nhãn hiện trên giao diện
#   kieu       van_ban | danh_sach | ma_so | ngay | anh | toa_do | so | email | dien_thoai | url
#   bat_buoc   có bắt buộc không
#   cach_lay   danh_muc | llm | nhap_tay | tu_dong
#   kiem_tra   danh sách quy tắc kiểm (xem khai_thac/kiem_tra.py)
#   mo_ta      ghi chú nghiệp vụ

phien_ban: 2026-10-11

cap:

  # ============================================================ TỈNH / THÀNH
  tinh:
    nhan: Tỉnh/Thành
    nhom:

      thong_tin_chung:
        nhan: Thông tin chung
        truong:
          - {khoa: ten, nhan: Tên tỉnh, thành phố, kieu: van_ban, bat_buoc: true, cach_lay: danh_muc, kiem_tra: [khong_rong]}
          - {khoa: loai, nhan: Loại đơn vị, kieu: danh_sach, bat_buoc: true, cach_lay: danh_muc, kiem_tra: [trong_danh_sach], gia_tri_cho_phep: [Tỉnh, Thành phố]}
